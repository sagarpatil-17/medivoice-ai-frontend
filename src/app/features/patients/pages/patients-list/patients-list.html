<!-- Patients Page Header -->
<div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">

    <div>
        <h1 class="text-2xl font-bold text-zinc-900">
            Patients
        </h1>

        <p class="mt-1 text-sm text-zinc-500">
            Manage patient records and registration details.
        </p>
    </div>

    <a routerLink="/patients/new" class="inline-flex items-center justify-center gap-2 rounded-xl
           bg-teal-800 px-5 py-3 text-sm font-semibold
           text-white shadow-sm transition hover:bg-teal-900
           focus:outline-none focus:ring-2 focus:ring-teal-500
           focus:ring-offset-2">
        <span class="text-lg">+</span>
        Add Patient
    </a>

</div>

<!-- Pagination -->
<div class="flex flex-col justify-between gap-4 border-t border-zinc-100 px-5 py-4 sm:flex-row sm:items-center">

    <div class="flex items-center gap-3">
        <p class="text-xs text-zinc-500">
            Total: {{ totalPatients() }} patients
        </p>

        <select [value]="pageSize()" (change)="changePageSize(+$any($event.target).value)"
            class="rounded-lg border border-zinc-200 bg-white px-2 py-1.5 text-xs text-zinc-600 outline-none focus:border-violet-400">
            <option value="10">10 per page</option>
            <option value="20">20 per page</option>
            <option value="50">50 per page</option>
        </select>
    </div>

    <div class="flex items-center gap-3">

        <span class="text-xs text-zinc-500">
            Page {{ currentPage() }} of {{ totalPages() || 1 }}
        </span>

        <button type="button" (click)="previousPage()" [disabled]="currentPage() === 1 || loading()"
            class="rounded-lg border border-zinc-200 px-3 py-2 text-xs font-medium text-zinc-600 transition hover:bg-zinc-50 disabled:cursor-not-allowed disabled:opacity-40">
            Previous
        </button>

        <button type="button" (click)="nextPage()" [disabled]="currentPage() >= totalPages() || loading()"
            class="rounded-lg border border-zinc-200 px-3 py-2 text-xs font-medium text-zinc-600 transition hover:bg-zinc-50 disabled:cursor-not-allowed disabled:opacity-40">
            Next
        </button>

    </div>

</div>
