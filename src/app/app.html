@if (authService.isInitializing()) {
<div
    class="fixed inset-0 z-50 flex min-h-screen flex-col items-center justify-center bg-gradient-to-b from-slate-50 to-teal-50/40 px-4">
    <div class="flex flex-col items-center text-center">

        <!-- Pulsing Voice Icon Container -->
        <div class="relative flex h-20 w-20 items-center justify-center">
            <!-- Outer soft ping ring -->
            <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-teal-400/20"></span>
            <!-- Inner static halo -->
            <span class="absolute inline-flex h-16 w-16 rounded-full bg-teal-500/10"></span>

            <!-- Center Badge with Animated Soundbars -->
            <div
                class="relative flex h-12 w-12 items-center justify-center gap-1 rounded-2xl bg-gradient-to-tr from-teal-600 to-violet-600 shadow-lg shadow-teal-600/20">
                <span class="h-3 w-1 animate-pulse rounded-full bg-white"></span>
                <span class="h-5 w-1 animate-bounce rounded-full bg-white" style="animation-delay: 0.1s"></span>
                <span class="h-6 w-1 animate-pulse rounded-full bg-white" style="animation-delay: 0.2s"></span>
                <span class="h-4 w-1 animate-bounce rounded-full bg-white" style="animation-delay: 0.3s"></span>
            </div>
        </div>

        <!-- Brand Title -->
        <h2 class="mt-6 text-2xl font-bold tracking-tight text-slate-800">
            MediVoice <span class="bg-gradient-to-r from-teal-600 to-violet-600 bg-clip-text text-transparent">AI</span>
        </h2>

        <!-- Status Pill -->
        <div
            class="mt-3 inline-flex items-center gap-2 rounded-full border border-slate-200/80 bg-white/80 px-3.5 py-1.5 shadow-sm backdrop-blur-sm">
            <span class="h-2 w-2 animate-pulse rounded-full bg-teal-500"></span>
            <p class="text-xs font-medium text-slate-600">
                Securing your clinical workspace...
            </p>
        </div>

    </div>
</div>

}

<router-outlet />
